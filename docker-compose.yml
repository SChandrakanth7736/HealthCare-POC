# ─────────────────────────────────────────────────────────────────────────────
# HealthCare POC — full local stack
#
#   Start everything:   docker compose up --build
#   Stop everything:    docker compose down
#   Wipe DB volume:     docker compose down -v
#
#   Endpoints:
#     Frontend  →  http://localhost:3000
#     Backend   →  http://localhost:8080
#     MongoDB   →  mongodb://localhost:27017
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── MongoDB ─────────────────────────────────────────────────────────────────
  mongodb:
    image: mongo:7
    container_name: healthcare-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - healthcare-net

  # ── Spring Boot Backend ──────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: healthcare-backend
    ports:
      - "8080:8080"
    environment:
      # Use dev profile so all endpoints are open (no OAuth required)
      SPRING_PROFILES_ACTIVE: dev
      # Point to the MongoDB container by service name
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/trainingPoc
      SPRING_DATA_MONGODB_UUID_REPRESENTATION: standard
      # JWK URI is still required to create the JwtDecoder bean (public URL, no auth needed)
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_GOOGLE_JWK_SET_URI: https://www.googleapis.com/oauth2/v3/certs
      # Placeholder OAuth credentials — not enforced in dev profile
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID: placeholder
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET: placeholder
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - healthcare-net

  # ── React Frontend (nginx) ───────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: healthcare-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - healthcare-net

networks:
  healthcare-net:
    driver: bridge

volumes:
  mongo_data:
